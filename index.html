
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS & JS Animations with LocalStorage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Welcome to my app!</h1>
  <p>Click the button to animate the image.</p>

  <button id="animateBtn">Click Me</button>
  <br/>
  <img id="funImage" class="animated" src="laptop-1478822_1920.jpg" alt="Example Image">

  <p>Use the toggle to switch between light and dark mode.</p>
  <div class="toggle-wrapper">
    <label>
      Dark Mode:
      <input type="checkbox" id="themeToggle">
    </label>
  </div>

  <script src="script.js"></script>
</body>
</html>
